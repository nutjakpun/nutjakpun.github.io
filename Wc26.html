<html>
    <head >
        <style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}

.full-percentage-iframe {
    position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  z-index: 9999;
  /*width: 100%;
  height: 100%;
  border: none;
  //display: block;*/
}
 .video-container {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 56.25%; /* Defines 16:9 Aspect Ratio (9 / 16 = 0.5625) */
  overflow: hidden;
}

.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}
            
        </style>
    </head>
<body>
    <iframe src="https://tv.laoid.net/world-cup" allowfullscreen="true" class="full-percentage-iframe"></iframe>    
</body>
    
</html>
